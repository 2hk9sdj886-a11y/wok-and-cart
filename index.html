<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wok &amp; Cart</title>
<meta name="description" content="Flavor-forward dinners, an aisle-ordered Wimberley H-E-B grocery list, and a daily calorie log.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wok & Cart">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Wok <span>&amp;</span> Cart</h1>
      <div class="today-pill" id="todayPill">Today <b>0</b> / 2000 kcal</div>
    </div>
    <button class="sync" id="sync" type="button" aria-label="Account and sync settings">Saved on this phone</button>
  </header>

  <div class="install" id="installHint" hidden></div>

  <section id="v-meals" aria-label="Meals"></section>
  <section id="v-list" aria-label="Grocery list" hidden></section>
  <section id="v-log" aria-label="Calorie log" hidden></section>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-tab="meals" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M17 7l4-4M14 6l2-3"/></svg>Meals</button>
    <button role="tab" data-tab="list" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span>List<span class="badge" id="listBadge" hidden></span></span></button>
    <button role="tab" data-tab="log" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16M9 15h6"/></svg>Log</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="recipes.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="account.js"></script>
</body>
</html>
